name: CI

# main is the stable line (vX.Y.Z); release/X.Y branches are prerelease lines (vX.Y.0-preview.N).
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (without v prefix). Leave empty to auto-bump from latest tag.'
        required: false

# Coalesce in-flight runs on the same ref so two main pushes don't race to publish the same version.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Default to read-only. Jobs that need more (publish) opt in explicitly.
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  CI: true

jobs:
  # main: read the latest stable v* tag and bump the patch; after a release/X.Y merge, X.Y.0.
  # release/X.Y: X.Y.0-preview.N, N one above the highest vX.Y.0-preview.* tag in the branch history.
  # If HEAD already carries the tag, reuse its version (re-run safe).
  # workflow_dispatch with an explicit version overrides the auto-bump.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: ver
        run: |
          BRANCH="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Workflow dispatch override: $VERSION"
          elif [[ "$BRANCH" =~ ^release/([0-9]+)\.([0-9]+)$ ]]; then
            BASE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0"
            HEAD_TAG=$(git tag --points-at HEAD --list "v$BASE-preview.*" | sort -V | tail -n1)
            if [ -n "$HEAD_TAG" ]; then
              VERSION="${HEAD_TAG#v}"
              echo "HEAD is tagged $HEAD_TAG — reusing version: $VERSION"
            else
              LAST=$(git tag --merged HEAD --list "v$BASE-preview.*" | sed -E 's/^.*-preview\.//' | sort -n | tail -n1)
              VERSION="$BASE-preview.$(( ${LAST:-0} + 1 ))"
              echo "Prerelease line $BRANCH — next preview: $VERSION"
            fi
          else
            # Stable tags only: preview tags merged in from a release/X.Y line never feed the patch bump.
            LATEST_TAG=$(git describe --tags --abbrev=0 --exclude '*-*' 2>/dev/null || echo "")
            # Once a release/X.Y line is merged in, its vX.Y.0-preview.* tags are in the history: ship X.Y.0
            # if it is newer than the latest stable tag and not tagged yet (the .NET GA merge).
            PREVIEW_BASE=$(git tag --merged HEAD --list 'v*-preview.*' | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-.*$/\1/' | sort -V | tail -n1)
            if [ -n "$PREVIEW_BASE" ] && ! git rev-parse -q --verify "refs/tags/v$PREVIEW_BASE" >/dev/null \
              && [ "$(printf '%s\n%s\n' "${LATEST_TAG#v}" "$PREVIEW_BASE" | sort -V | tail -n1)" = "$PREVIEW_BASE" ]; then
              VERSION="$PREVIEW_BASE"
              echo "Preview line v$PREVIEW_BASE-preview.* merged — releasing: $VERSION"
            elif [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR=${BASH_REMATCH[1]}
              MINOR=${BASH_REMATCH[2]}
              PATCH=${BASH_REMATCH[3]}
              if git tag --points-at HEAD | grep -qFx "$LATEST_TAG"; then
                VERSION="$MAJOR.$MINOR.$PATCH"
                echo "HEAD is tagged $LATEST_TAG — reusing version: $VERSION"
              else
                PATCH=$((PATCH + 1))
                VERSION="$MAJOR.$MINOR.$PATCH"
                echo "Commits after $LATEST_TAG — bumped to: $VERSION"
              fi
            else
              VERSION="0.0.1"
              echo "No v* tag found — defaulting to: $VERSION"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Build on both Linux and Windows to catch path-case and platform-specific build issues
  # early. Pack/upload only from Linux to avoid duplicate artifacts (output is netstandard2.0,
  # platform-invariant, so a single nupkg set is correct).
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'
      - name: Restore
        run: dotnet restore ANcpLua.Roslyn.Utilities.slnx
      - name: Build
        run: dotnet build ANcpLua.Roslyn.Utilities.slnx -c Release --no-restore -p:Version=${{ needs.version.outputs.version }}

      # Run the suites against the just-built output. publish `needs: build`, so a runtime
      # regression here fails the job and a broken package can never reach nuget.org — the
      # build alone only proves the tests compile, not that they pass.
      - name: Test
        run: dotnet test ANcpLua.Roslyn.Utilities.slnx -c Release --no-build

      # Stable packages — packed once on Linux only.
      - name: Pack (stable)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/ANcpLua.Roslyn.Utilities/ANcpLua.Roslyn.Utilities.csproj -c Release -o artifacts -p:Version=${{ needs.version.outputs.version }} --no-build
          dotnet pack src/ANcpLua.Roslyn.Utilities.Polyfills/ANcpLua.Roslyn.Utilities.Polyfills.csproj -c Release -o artifacts -p:Version=${{ needs.version.outputs.version }} --no-build
          dotnet pack src/ANcpLua.Roslyn.Utilities.Sources/ANcpLua.Roslyn.Utilities.Sources.csproj -c Release -o artifacts -p:Version=${{ needs.version.outputs.version }} --no-build
          dotnet pack src/ANcpLua.Roslyn.Utilities.Testing.Aot/ANcpLua.Roslyn.Utilities.Testing.Aot.csproj -c Release -o artifacts -p:Version=${{ needs.version.outputs.version }} --no-build
          dotnet pack src/ANcpLua.Roslyn.Utilities.Testing/ANcpLua.Roslyn.Utilities.Testing.csproj -c Release -o artifacts -p:Version=${{ needs.version.outputs.version }} --no-build

      # AgentTesting + Testing.Workflows moved to https://github.com/ANcpLua/ANcpLua.Agents
      # (2026-04-19) and publish from that repo's own workflow.

      - name: Upload artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  # Publish on push to main (auto-bump-on-merge), on push to release/** (the branch's next
  # prerelease, listed on nuget.org as prerelease and never as latest), or workflow_dispatch.
  # The `Must Publish Packages` gate diffs against the latest tag. It counts changes under
  # `src/**`, `tests/**`, and the root `README.md` — the root README ships as
  # `PackageReadmeFile` in every shipped pack, so a README change is a real consumer-facing
  # surface change worth republishing. PRs that touch only repo-internal files (CI workflows,
  # `.editorconfig`, sub-`CLAUDE.md` files, etc.) still skip publish.
  # The `nuget` environment houses the trusted publishing config.
  #
  # Trusted publishing setup (one-time, per package):
  #   1. Visit https://www.nuget.org/account/trustedpublishing
  #   2. For each ANcpLua.Roslyn.Utilities.* package owned by ANcpLua, add a GitHub policy
  #      pointing at this repo + workflow file (`nuget-publish.yml`) + environment (`nuget`).
  #   3. No NUGET_API_KEY secret required — OIDC handles auth.
  publish:
    needs: [version, build]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write   # for gh release create
      id-token: write   # for trusted publishing OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Must Publish Packages
        id: has_changes
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tag — first publish, proceeding"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            # Version.props / Directory.Packages.props drive the shipped nuspecs' dependency
            # versions — a dep bump with no src/ change must still publish.
            CHANGES=$(git diff --name-only "$LATEST_TAG" HEAD -- 'src/**' 'tests/**' 'README.md' 'Version.props' 'Directory.Packages.props' '.github/workflows/nuget-publish.yml' || true)
            if [ -n "$CHANGES" ]; then
              echo "Changes since $LATEST_TAG:"
              echo "$CHANGES"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "No publishable changes (src/, tests/, README.md, Version.props, Directory.Packages.props) since $LATEST_TAG — skipping publish"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.has_changes.outputs.has_changes == 'true'
        with:
          name: packages
          path: artifacts/

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: steps.has_changes.outputs.has_changes == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Authenticate to NuGet (trusted publishing)
        if: steps.has_changes.outputs.has_changes == 'true'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ANcpLua

      - name: Push to NuGet
        if: steps.has_changes.outputs.has_changes == 'true'
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Create GitHub release
        if: steps.has_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          elif [[ "$VERSION" == *-* ]]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --generate-notes --title "$TAG"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
          fi
